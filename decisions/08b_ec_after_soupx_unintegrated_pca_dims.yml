summary:
  selected_npcs: 15
  rationale: >
    The variance explained curve shows a strong decline across the first PCs,
    followed by a visible flattening after approximately PC15. PCs 11 to 15
    still appear to contain structured signal, while PCs beyond 15 contribute
    increasingly marginal variance. A 15-PC choice provides a balanced tradeoff
    between retaining biological structure and limiting noise for downstream
    unintegrated clustering and UMAP.

